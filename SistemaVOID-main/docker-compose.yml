version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: void_user
      POSTGRES_PASSWORD: void_password
      POSTGRES_DB: void_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://void_user:void_password@postgres:5432/void_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=void_super_secret_jwt_key
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
